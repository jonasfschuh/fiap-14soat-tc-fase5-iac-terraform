name: Terraform Destroy - Infra Local K8s

on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: self-hosted
    defaults:
      run:
        working-directory: infra
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # O terraform destroy também avalia os file() do observability.tf ao ler
      # o estado da configuração, portanto o repo de observabilidade precisa estar
      # disponível no mesmo caminho relativo usado localmente.
      # O runner self-hosted é persistente: se o diretório já existir de uma
      # execução anterior, é preciso atualizá-lo (pull) em vez de pular o
      # clone, senão arquivos novos/alterados no repo de observability nunca
      # chegam ao runner.
      - name: Checkout observability dashboards
        working-directory: ${{ github.workspace }}
        run: |
          OBSERVABILITY_DIR="$(dirname "$GITHUB_WORKSPACE")/fiap-14soat-tc-fase5-observability"
          REMOTE="https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonasfschuh/fiap-14soat-tc-fase5-observability"
          if [ ! -d "$OBSERVABILITY_DIR" ]; then
            git clone --depth 1 "$REMOTE" "$OBSERVABILITY_DIR"
          else
            git -C "$OBSERVABILITY_DIR" fetch --depth 1 origin main
            git -C "$OBSERVABILITY_DIR" reset --hard origin/main
            git -C "$OBSERVABILITY_DIR" clean -fd
          fi

      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
