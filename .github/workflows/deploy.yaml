name: Terraform Apply - Infra Local K8s

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'helm-values/**'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply

    # Runner Windows local
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: infra
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mantém o terraform.tfstate entre execuções — sem isso o git clean apaga
          # o arquivo (gitignored) e o Terraform perde o estado do cluster.
          clean: false

      # Clona o repo de observabilidade no mesmo nível que o repo IAC para que
      # os file() em observability.tf resolvam corretamente (../../fiap-14soat-tc-fase5-observability).
      - name: Checkout observability dashboards
        working-directory: ${{ github.workspace }}
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "fiap-14soat-tc-fase5-observability"
          if (-not (Test-Path $target)) {
            git clone --depth 1 `
              "https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonasfschuh/fiap-14soat-tc-fase5-observability" `
              $target
          }

      - name: Configurar PATH do Helm
        run: |
          $helmPath = "C:\Users\jonas\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          Add-Content $env:GITHUB_PATH $helmPath

      - name: Verificar ferramentas
        run: |
          terraform version
          kubectl version --client
          helm version

      - name: Verificar Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false

      - name: Importar recursos já existentes no cluster
        # Bootstrap: importa todos os recursos que já existem no cluster mas não
        # estão no estado Terraform (ocorre na primeira execução ou após perda do tfstate).
        # Na segunda execução em diante, o clean:false preserva o estado e todos
        # os TryImport são ignorados (SKIP).
        run: |
          $raw = terraform state list 2>$null
          $stateList = if ($null -ne $raw -and $raw.Length -gt 0) { @($raw) } else { @() }
          Write-Host "[INFO] $($stateList.Count) recurso(s) no estado atual."

          function TryImport {
            param([string]$addr, [string]$id)
            if ($stateList -contains $addr) {
              Write-Host "[SKIP]   $addr"
              return
            }
            Write-Host "[IMPORT] $addr <- $id"
            terraform import $addr $id
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "[AVISO]  $addr : falhou (pode nao existir ainda, sera criado no apply)"
            }
          }

          $ns = "fiapx"

          # ── Namespace e Storage ────────────────────────────────────────────────
          TryImport "kubernetes_namespace_v1.fiapx"                        "$ns"
          TryImport "kubernetes_persistent_volume_v1.video_storage"        "fiapx-video-storage"
          TryImport "kubernetes_persistent_volume_claim_v1.video_storage"  "$ns/fiapx-video-pvc"

          # ── ConfigMaps ─────────────────────────────────────────────────────────
          TryImport "kubernetes_config_map_v1.mail_config"             "$ns/mail-config"
          TryImport "kubernetes_config_map_v1.rabbitmq_config"         "$ns/rabbitmq-config"
          TryImport "kubernetes_config_map_v1.rabbitmq_server_config"  "$ns/rabbitmq-server-config"
          TryImport "kubernetes_config_map_v1.grafana_dashboards"      "$ns/grafana-dashboards"

          # ── Secrets ────────────────────────────────────────────────────────────
          TryImport "kubernetes_secret_v1.jwt_secret"           "$ns/jwt-secret"
          TryImport "kubernetes_secret_v1.rabbitmq_secret"      "$ns/rabbitmq-secret"
          TryImport "kubernetes_secret_v1.rabbitmq_definitions" "$ns/rabbitmq-definitions"
          foreach ($k in @("auth", "upload", "processing", "status")) {
            TryImport "kubernetes_secret_v1.postgres_secret[`"$k`"]" "$ns/postgres-$k-secret"
          }

          # ── RabbitMQ ───────────────────────────────────────────────────────────
          TryImport "kubernetes_stateful_set_v1.rabbitmq"       "$ns/rabbitmq"
          TryImport "kubernetes_service_v1.rabbitmq_amqp"       "$ns/rabbitmq"
          TryImport "kubernetes_service_v1.rabbitmq_management" "$ns/rabbitmq-management"
          TryImport "kubernetes_service_v1.rabbitmq_amqp_lb"    "$ns/rabbitmq-amqp-lb"

          # ── PostgreSQL (for_each: auth, upload, processing, status) ────────────
          foreach ($k in @("auth", "upload", "processing", "status")) {
            TryImport "kubernetes_service_v1.postgres[`"$k`"]"      "$ns/postgres-$k"
            TryImport "kubernetes_stateful_set_v1.postgres[`"$k`"]" "$ns/postgres-$k"
            TryImport "kubernetes_service_v1.postgres_lb[`"$k`"]"   "$ns/postgres-$k-lb"
          }

          # ── MailHog ────────────────────────────────────────────────────────────
          TryImport "kubernetes_deployment_v1.mailhog" "$ns/mailhog"
          TryImport "kubernetes_service_v1.mailhog"    "$ns/mailhog"
          TryImport "kubernetes_service_v1.mailhog_lb" "$ns/mailhog-lb"

          # ── Helm releases ──────────────────────────────────────────────────────
          TryImport "helm_release.ingress_nginx" "$ns/ingress-nginx"
          TryImport "helm_release.prometheus"    "$ns/prometheus"
          TryImport "helm_release.grafana"       "$ns/grafana"

          # ── Ingress ────────────────────────────────────────────────────────────
          TryImport "kubernetes_ingress_v1.fiapx" "$ns/fiapx-ingress"
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Exibir outputs
        run: terraform output