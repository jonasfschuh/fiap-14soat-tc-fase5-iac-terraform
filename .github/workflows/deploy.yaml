name: Terraform Apply - Infra Local K8s

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'helm-values/**'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply

    # Runner Windows local
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: infra
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PATH do Helm
        run: |
          $env:Path += ";C:\Users\jonas\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          echo "PATH configurado"
          helm version

      - name: Verificar ferramentas
        run: |
          terraform version
          kubectl version --client
          helm version

      - name: Verificar Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Exibir outputs
        run: terraform output