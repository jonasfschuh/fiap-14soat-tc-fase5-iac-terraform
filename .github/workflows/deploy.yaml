name: Terraform Apply - Infra Local K8s

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'helm-values/**'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply

    # Runner Windows local
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: infra
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mantém o terraform.tfstate entre execuções — sem isso o git clean apaga
          # o arquivo (gitignored) e o Terraform perde o estado do cluster.
          clean: false

      # Clona o repo de observabilidade no mesmo nível que o repo IAC para que
      # os file() em observability.tf resolvam corretamente (../../fiap-14soat-tc-fase5-observability).
      - name: Checkout observability dashboards
        working-directory: ${{ github.workspace }}
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "fiap-14soat-tc-fase5-observability"
          if (-not (Test-Path $target)) {
            git clone --depth 1 `
              "https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonasfschuh/fiap-14soat-tc-fase5-observability" `
              $target
          }

      - name: Configurar PATH do Helm
        run: |
          $helmPath = "C:\Users\jonas\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          Add-Content $env:GITHUB_PATH $helmPath

      - name: Verificar ferramentas
        run: |
          terraform version
          kubectl version --client
          helm version

      - name: Verificar Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false

      - name: Importar recursos já existentes no cluster
        # Bootstrap: importa todos os recursos de infraestrutura já existentes.
        # Usa ProcessStartInfo do .NET para chamar terraform diretamente via
        # CreateProcess — bypassa o mangling de aspas do PowerShell em for_each
        # (ex: postgres["auth"]) E evita o WSL bash que não está instalado.
        run: |
          $stateRaw = terraform state list 2>$null
          $state = if ($stateRaw) { @($stateRaw) } else { @() }
          Write-Host "[INFO] $($state.Count) recurso(s) no estado."

          function Invoke-TerraformImport {
            param([string]$addr, [string]$id)
            if ($state -contains $addr) {
              Write-Host "[SKIP]   $addr"
              return
            }
            Write-Host "[IMPORT] $addr <- $id"
            # Escapa aspas internas para CommandLineToArgvW e envolve em aspas externas.
            # Isso garante que terraform receba o endereco com ["key"] intacto.
            $escapedAddr = '"' + $addr.Replace('\', '\\').Replace('"', '\"') + '"'
            $psi = [System.Diagnostics.ProcessStartInfo]::new(
              "terraform",
              "import $escapedAddr $id"
            )
            $psi.UseShellExecute   = $false
            $psi.WorkingDirectory  = (Get-Location).Path
            $proc = [System.Diagnostics.Process]::Start($psi)
            $proc.WaitForExit()
            if ($proc.ExitCode -ne 0) {
              Write-Warning "[AVISO]  $addr : falhou (sera criado no apply)"
            }
          }

          $ns = "fiapx"

          # ── Namespace e Storage ────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_namespace_v1.fiapx"                        $ns
          Invoke-TerraformImport "kubernetes_persistent_volume_v1.video_storage"        "fiapx-video-storage"
          Invoke-TerraformImport "kubernetes_persistent_volume_claim_v1.video_storage"  "$ns/fiapx-video-pvc"

          # ── ConfigMaps ─────────────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_config_map_v1.mail_config"             "$ns/mail-config"
          Invoke-TerraformImport "kubernetes_config_map_v1.rabbitmq_config"         "$ns/rabbitmq-config"
          Invoke-TerraformImport "kubernetes_config_map_v1.rabbitmq_server_config"  "$ns/rabbitmq-server-config"
          Invoke-TerraformImport "kubernetes_config_map_v1.grafana_dashboards"      "$ns/grafana-dashboards"

          # ── Secrets ────────────────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_secret_v1.jwt_secret"           "$ns/jwt-secret"
          Invoke-TerraformImport "kubernetes_secret_v1.rabbitmq_secret"      "$ns/rabbitmq-secret"
          Invoke-TerraformImport "kubernetes_secret_v1.rabbitmq_definitions" "$ns/rabbitmq-definitions"
          foreach ($k in @("auth", "upload", "processing", "status")) {
            Invoke-TerraformImport "kubernetes_secret_v1.postgres_secret[`"$k`"]" "$ns/postgres-$k-secret"
          }

          # ── RabbitMQ ───────────────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_stateful_set_v1.rabbitmq"       "$ns/rabbitmq"
          Invoke-TerraformImport "kubernetes_service_v1.rabbitmq_amqp"       "$ns/rabbitmq"
          Invoke-TerraformImport "kubernetes_service_v1.rabbitmq_management" "$ns/rabbitmq-management"
          Invoke-TerraformImport "kubernetes_service_v1.rabbitmq_amqp_lb"    "$ns/rabbitmq-amqp-lb"

          # ── PostgreSQL (for_each: auth, upload, processing, status) ────────────
          foreach ($k in @("auth", "upload", "processing", "status")) {
            Invoke-TerraformImport "kubernetes_service_v1.postgres[`"$k`"]"      "$ns/postgres-$k"
            Invoke-TerraformImport "kubernetes_stateful_set_v1.postgres[`"$k`"]" "$ns/postgres-$k"
            Invoke-TerraformImport "kubernetes_service_v1.postgres_lb[`"$k`"]"   "$ns/postgres-$k-lb"
          }

          # ── MailHog ────────────────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_deployment_v1.mailhog" "$ns/mailhog"
          Invoke-TerraformImport "kubernetes_service_v1.mailhog"    "$ns/mailhog"
          Invoke-TerraformImport "kubernetes_service_v1.mailhog_lb" "$ns/mailhog-lb"

          # ── Helm releases ──────────────────────────────────────────────────────
          Invoke-TerraformImport "helm_release.ingress_nginx" "$ns/ingress-nginx"
          Invoke-TerraformImport "helm_release.prometheus"    "$ns/prometheus"
          Invoke-TerraformImport "helm_release.grafana"       "$ns/grafana"

          # ── Ingress ────────────────────────────────────────────────────────────
          Invoke-TerraformImport "kubernetes_ingress_v1.fiapx" "$ns/fiapx-ingress"
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Exibir outputs
        run: terraform output

      - name: Sumário da infraestrutura provisionada
        # Exibe no log E no painel "Summary" da execução do Actions
        run: |
          $lines = @(
            "",
            "================================================================",
            "  [OK] Infraestrutura local K8s provisionada com sucesso!",
            "================================================================",
            "",
            "  Servico               URL / Endereco              Observacao",
            "  -------------------- ---------------------------- ----------------------------------------",
            "  MailHog UI           http://localhost:8025        Caixa de e-mails de teste",
            "  MailHog SMTP         localhost:1025               Conexao das aplicacoes locais",
            "  RabbitMQ Management  http://localhost:15672       user: fiapx | pwd: fiapx123 | vhost: fiapx",
            "  RabbitMQ AMQP        localhost:5672               Conexao dos microservices",
            "  PostgreSQL auth      localhost:5430               Banco: auth_db",
            "  PostgreSQL upload    localhost:5433               Banco: video_upload_db",
            "  PostgreSQL status    localhost:5434               Banco: video_status_db",
            "  PostgreSQL process.  localhost:5435               Banco: video_processing_db",
            "  Prometheus           http://localhost:9090        Coleta de metricas",
            "  Grafana              http://localhost:3000        Dashboards (user: admin)",
            "  Ingress              http://localhost             Roteamento HTTP do cluster",
            "  Storage              /data/fiapx-videos           PersistentVolume de videos",
            "",
            "================================================================",
            ""
          )
          $lines | ForEach-Object { Write-Host $_ }

          # Painel Summary do GitHub Actions
          $md = @(
            "## Infraestrutura Local K8s - Provisionada com Sucesso",
            "",
            "| Servico | URL / Endereco | Observacao |",
            "|---------|----------------|------------|",
            "| **MailHog UI** | http://localhost:8025 | Caixa de e-mails de teste |",
            "| **MailHog SMTP** | localhost:1025 | Conexao das aplicacoes locais |",
            "| **RabbitMQ Management** | http://localhost:15672 | user: fiapx / pwd: fiapx123 / vhost: fiapx |",
            "| **RabbitMQ AMQP** | localhost:5672 | Conexao dos microservices |",
            "| **PostgreSQL auth** | localhost:5430 | Banco: auth_db |",
            "| **PostgreSQL upload** | localhost:5433 | Banco: video_upload_db |",
            "| **PostgreSQL status** | localhost:5434 | Banco: video_status_db |",
            "| **PostgreSQL processing** | localhost:5435 | Banco: video_processing_db |",
            "| **Prometheus** | http://localhost:9090 | Coleta de metricas |",
            "| **Grafana** | http://localhost:3000 | Dashboards (user: admin) |",
            "| **Ingress** | http://localhost | Roteamento HTTP do cluster |",
            "| **Storage** | /data/fiapx-videos | PersistentVolume de videos |"
          )
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append