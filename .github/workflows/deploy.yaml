name: Terraform Apply - Infra Local K8s

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'helm-values/**'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply

    # Runner Windows local
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: infra
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mantém o terraform.tfstate entre execuções — sem isso o git clean apaga
          # o arquivo (gitignored) e o Terraform perde o estado do cluster.
          clean: false

      # Clona o repo de observabilidade no mesmo nível que o repo IAC para que
      # os file() em observability.tf resolvam corretamente (../../fiap-14soat-tc-fase5-observability).
      - name: Checkout observability dashboards
        working-directory: ${{ github.workspace }}
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "fiap-14soat-tc-fase5-observability"
          if (-not (Test-Path $target)) {
            git clone --depth 1 `
              "https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonasfschuh/fiap-14soat-tc-fase5-observability" `
              $target
          }

      - name: Configurar PATH do Helm
        run: |
          $helmPath = "C:\Users\jonas\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          Add-Content $env:GITHUB_PATH $helmPath

      - name: Verificar ferramentas
        run: |
          terraform version
          kubectl version --client
          helm version

      - name: Verificar Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false

      - name: Importar recursos já existentes no cluster
        # Bootstrap: importa todos os recursos de infraestrutura que já existem no
        # cluster mas não estão no estado Terraform.
        # Usa shell bash para garantir quoting correto dos endereços for_each
        # (ex: kubernetes_service_v1.postgres["auth"]) — o PowerShell no Windows
        # strips as aspas internas ao passar para o processo filho.
        shell: bash
        working-directory: infra
        run: |
          NS="fiapx"
          STATE=$(terraform state list 2>/dev/null || true)

          try_import() {
            local addr="$1"
            local id="$2"
            if echo "$STATE" | grep -qxF "$addr"; then
              echo "[SKIP]   $addr"
            else
              echo "[IMPORT] $addr <- $id"
              terraform import "$addr" "$id" \
                || echo "[AVISO]  $addr : falhou (sera criado no apply)"
            fi
          }

          # ── Namespace e Storage ──────────────────────────────────────────────
          try_import "kubernetes_namespace_v1.fiapx"                        "$NS"
          try_import "kubernetes_persistent_volume_v1.video_storage"        "fiapx-video-storage"
          try_import "kubernetes_persistent_volume_claim_v1.video_storage"  "$NS/fiapx-video-pvc"

          # ── ConfigMaps ───────────────────────────────────────────────────────
          try_import "kubernetes_config_map_v1.mail_config"             "$NS/mail-config"
          try_import "kubernetes_config_map_v1.rabbitmq_config"         "$NS/rabbitmq-config"
          try_import "kubernetes_config_map_v1.rabbitmq_server_config"  "$NS/rabbitmq-server-config"
          try_import "kubernetes_config_map_v1.grafana_dashboards"      "$NS/grafana-dashboards"

          # ── Secrets ──────────────────────────────────────────────────────────
          try_import "kubernetes_secret_v1.jwt_secret"           "$NS/jwt-secret"
          try_import "kubernetes_secret_v1.rabbitmq_secret"      "$NS/rabbitmq-secret"
          try_import "kubernetes_secret_v1.rabbitmq_definitions" "$NS/rabbitmq-definitions"
          for k in auth upload processing status; do
            try_import "kubernetes_secret_v1.postgres_secret[\"$k\"]" "$NS/postgres-$k-secret"
          done

          # ── RabbitMQ ─────────────────────────────────────────────────────────
          try_import "kubernetes_stateful_set_v1.rabbitmq"       "$NS/rabbitmq"
          try_import "kubernetes_service_v1.rabbitmq_amqp"       "$NS/rabbitmq"
          try_import "kubernetes_service_v1.rabbitmq_management" "$NS/rabbitmq-management"
          try_import "kubernetes_service_v1.rabbitmq_amqp_lb"    "$NS/rabbitmq-amqp-lb"

          # ── PostgreSQL (for_each: auth, upload, processing, status) ──────────
          for k in auth upload processing status; do
            try_import "kubernetes_service_v1.postgres[\"$k\"]"      "$NS/postgres-$k"
            try_import "kubernetes_stateful_set_v1.postgres[\"$k\"]" "$NS/postgres-$k"
            try_import "kubernetes_service_v1.postgres_lb[\"$k\"]"   "$NS/postgres-$k-lb"
          done

          # ── MailHog ──────────────────────────────────────────────────────────
          try_import "kubernetes_deployment_v1.mailhog" "$NS/mailhog"
          try_import "kubernetes_service_v1.mailhog"    "$NS/mailhog"
          try_import "kubernetes_service_v1.mailhog_lb" "$NS/mailhog-lb"

          # ── Helm releases ────────────────────────────────────────────────────
          try_import "helm_release.ingress_nginx" "$NS/ingress-nginx"
          try_import "helm_release.prometheus"    "$NS/prometheus"
          try_import "helm_release.grafana"       "$NS/grafana"

          # ── Ingress ──────────────────────────────────────────────────────────
          try_import "kubernetes_ingress_v1.fiapx" "$NS/fiapx-ingress"
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Exibir outputs
        run: terraform output