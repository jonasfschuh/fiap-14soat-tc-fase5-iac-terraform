name: Terraform Apply - Infra Local K8s

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'helm-values/**'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply

    # Runner Windows local
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        working-directory: infra
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mantém o terraform.tfstate entre execuções — sem isso o git clean apaga
          # o arquivo (gitignored) e o Terraform perde o estado do cluster.
          clean: false

      # Clona o repo de observabilidade no mesmo nível que o repo IAC para que
      # os file() em observability.tf resolvam corretamente (../../fiap-14soat-tc-fase5-observability).
      - name: Checkout observability dashboards
        working-directory: ${{ github.workspace }}
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "fiap-14soat-tc-fase5-observability"
          if (-not (Test-Path $target)) {
            git clone --depth 1 `
              "https://x-access-token:${{ secrets.GH_PAT }}@github.com/jonasfschuh/fiap-14soat-tc-fase5-observability" `
              $target
          }

      - name: Configurar PATH do Helm
        run: |
          $helmPath = "C:\Users\jonas\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          Add-Content $env:GITHUB_PATH $helmPath

      - name: Verificar ferramentas
        run: |
          terraform version
          kubectl version --client
          helm version

      - name: Verificar Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init -input=false

      - name: Importar recursos já existentes no cluster
        # Importa recursos que podem existir no cluster mas não no tfstate atual.
        # Isso ocorre quando o estado foi perdido (primeira execução ou limpeza de workspace).
        # O check via 'terraform state list' evita erro de double-import.
        run: |
          $inState = terraform state list 2>$null
          if ($inState -notcontains "kubernetes_namespace_v1.fiapx") {
            Write-Host "[INFO] Importando namespace fiapx..."
            terraform import kubernetes_namespace_v1.fiapx fiapx
          } else {
            Write-Host "[INFO] kubernetes_namespace_v1.fiapx ja esta no estado."
          }
          if ($inState -notcontains "kubernetes_persistent_volume_v1.video_storage") {
            Write-Host "[INFO] Importando PersistentVolume fiapx-video-storage..."
            terraform import kubernetes_persistent_volume_v1.video_storage fiapx-video-storage
          } else {
            Write-Host "[INFO] kubernetes_persistent_volume_v1.video_storage ja esta no estado."
          }
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_rabbitmq_password: ${{ secrets.RABBITMQ_PASSWORD }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Exibir outputs
        run: terraform output