server:
  service:
    type: LoadBalancer
    servicePort: 9090
  persistentVolume:
    enabled: false

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: false

# OBS: os microservicos Spring Boot NAO precisam de extraScrapeConfigs aqui.
# Dentro do cluster K8s real, o job embutido "kubernetes-pods" (auto-discovery
# do proprio chart do Prometheus) ja descobre e faz scrape de todos os pods
# que tenham as annotations "prometheus.io/scrape: true" (presentes em cada
# deployment.yaml dos microservicos), atribuindo o label "app" a partir do
# label "app" do pod (ex.: auth-api, video-upload-api, video-processing-api,
# video-status-api, video-download-api, notification-api).
# Um extraScrapeConfigs estatico apontando para "host.docker.internal" (usado
# no modo Docker Compose) NUNCA resolve dentro da rede do cluster K8s, entao
# esses jobs ficavam permanentemente DOWN. Os dashboards do Grafana usam o
# label "app" (nao "job") para funcionar em ambos os modos.

# Regras de alerta equivalentes às do repositório observability.
# Usam o label "app" (convencao "<nome>-api") para cobrir tanto os servicos
# ja implantados quanto os futuros, sem precisar listar cada job manualmente.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: service_availability
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{app=~".*-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servico {{ $labels.app }} esta fora do ar"
              description: "O servico {{ $labels.app }} nao responde ha mais de 1 minuto."

          - alert: ServiceRestarting
            expr: changes(process_start_time_seconds{app=~".*-api"}[10m]) > 2
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Servico {{ $labels.app }} reiniciou multiplas vezes"
              description: "O servico reiniciou mais de 2 vezes nos ultimos 10 minutos."

      - name: http_performance
        rules:
          - alert: HighErrorRate5xx
            expr: |
              (
                rate(http_server_requests_seconds_count{status=~"5.."}[5m])
                /
                rate(http_server_requests_seconds_count[5m])
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Alta taxa de erros 5xx em {{ $labels.app }}"
              description: "Taxa de erros HTTP 5xx acima de 5% no servico {{ $labels.app }}."

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95,
                rate(http_server_requests_seconds_bucket[5m])
              ) > 2.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latencia p95 alta em {{ $labels.app }}"
              description: "Latencia p95 acima de 2 segundos no servico {{ $labels.app }}."

          - alert: HighJvmHeapUsage
            expr: |
              (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Uso de heap JVM alto em {{ $labels.app }}"
              description: "Heap JVM acima de 85% no servico {{ $labels.app }}."

      - name: video_processing
        rules:
          - alert: VideoProcessingErrors
            expr: |
              rate(http_server_requests_seconds_count{
                app="video-processing-api", status=~"5.."
              }[10m]) > 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alta taxa de falhas no processamento de video"
              description: "O video-processing-service esta falhando com alta frequencia."

          - alert: NotificationEmailFailures
            expr: |
              rate(http_server_requests_seconds_count{
                app="notification-api", status=~"5.."
              }[10m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Falhas no envio de notificacoes"
              description: "O notification-service esta com falhas de envio de e-mail."

          - alert: HighGcPauseTime
            expr: |
              rate(jvm_gc_pause_seconds_sum[5m])
              /
              rate(jvm_gc_pause_seconds_count[5m]) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pausas de GC elevadas em {{ $labels.app }}"
              description: "O GC esta pausando a JVM por mais de 500ms no servico {{ $labels.app }}."
